name: Dataroma (prueba)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dataroma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements.txt
      - run: python scripts/download_dataroma.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dataroma
          git commit -m "dataroma $(date -u +%F) [skip ci]" || echo "sin cambios"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 10; done
